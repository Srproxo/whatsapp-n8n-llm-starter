name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflow JSON
        run: |
          for f in workflows/*.json scripts/fixtures/*.json; do jq empty "$f"; done
      - name: Check shell script syntax
        run: bash -n scripts/simulate.sh
      - name: Run tests
        run: npm test
